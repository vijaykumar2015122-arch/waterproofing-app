name: Chatbot Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'chatbot-service/**'
      - '.github/workflows/chatbot-service-ci.yml'

permissions:
  contents: write

jobs:
  build-chatbot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set Image Tag
      run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Chatbot
      run: |
        docker build --no-cache           -t vijaym1999/waterproofing-chatbot:${IMAGE_TAG}           ./chatbot-service

    - name: Push Chatbot
      run: |
        docker push vijaym1999/waterproofing-chatbot:${IMAGE_TAG}

    - name: Update Chatbot Manifest
      run: |
        sed -i "s|image: vijaym1999/waterproofing-chatbot:.*|image: vijaym1999/waterproofing-chatbot:${IMAGE_TAG}|g"           chatbot-service/k8s/deployment.yaml

    - name: Commit Changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
- name: Commit changes
  run: |
    git config user.name "github-actions"
    git config user.email "actions@github.com"
    git add .
    git commit -m "update image tag ${IMAGE_TAG}" || echo "no changes"
    git pull --rebase origin main
    git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
