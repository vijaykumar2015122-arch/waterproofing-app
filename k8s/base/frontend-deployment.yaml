apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: waterproof
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vijaym1999/waterproofing-frontend:893b81209e1582028ea9d6178262381fc3ce4dd2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
