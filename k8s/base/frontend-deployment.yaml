apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: waterproof
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vijaym1999/waterproofing-frontend:966b7281899b35f0f20295f8d796d863a38050d8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
