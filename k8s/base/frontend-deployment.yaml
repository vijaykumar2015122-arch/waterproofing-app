apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: waterproof
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vijaym1999/waterproofing-frontend:9394eb0d0a1746b74f6154a58eb0c1ddfe2e920d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
