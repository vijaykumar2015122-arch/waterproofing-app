apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: waterproof
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vijaym1999/waterproofing-frontend:b1c801e4dd5b10eb2bf4320692a1ba5ab93af983
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
