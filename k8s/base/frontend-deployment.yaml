apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vijaym1999/waterproofing-frontend:3ec0bf6c4bb3de9d70e952fd3d384995aa26506e
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
